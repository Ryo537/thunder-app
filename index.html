<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマスロサンダー 逆引き図鑑</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>スマスロサンダー 逆引き図鑑</h3>

    <div class="header-menu">
        <button onclick="showAllMissionsModal(1)">一覧</button>
        <button onclick="showUnlearnedModal()">未習得</button>
        <button onclick="showSpecialModal()">特殊</button>
        <button onclick="showModal('thunder_reel_table.jpg')">リール表</button>
    </div>

    <div class="pachi-container">
        <div class="reel-column">
            <input type="checkbox" id="checkLeft" onchange="toggleLock(0)">
            <div class="reel-scroll-box" id="leftReelBox"><div class="reel-image-wrap"><img src="thunder_left.jpg"></div></div>
        </div>
        <div class="reel-column">
            <input type="checkbox" id="checkMid" onchange="toggleLock(1)">
            <div class="reel-scroll-box" id="midReelBox"><div class="reel-image-wrap"><img src="thunder_mid.jpg"></div></div>
        </div>
        <div class="reel-column">
            <input type="checkbox" id="checkRight" onchange="toggleLock(2)">
            <div class="reel-scroll-box" id="rightReelBox"><div class="reel-image-wrap"><img src="thunder_right.jpg"></div></div>
        </div>
    </div>

    <div id="infoBar" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; margin: 10px auto; color: #fff; font-weight: bold; padding: 0 5px; box-sizing: border-box;">
        <div id="reelPos" style="font-size: 14px; color: #aaa;">L:-- | M:-- | R:--</div>
        <div id="progressDisplay" style="font-size: 14px; color: #ff7b00;">達成状況: 0/150</div>
    </div>
    
    <div class="list-container" id="collectionCards"></div>

    <div id="modal" onclick="closeModal()"><div id="modalContent" onclick="event.stopPropagation()"></div></div>
    
    <script src="main.js" defer></script>
</body>
</html>
